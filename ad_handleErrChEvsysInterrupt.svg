e-block; font-size: 12px; font-family: Helvetica; color: rgb(0, 0, 0); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;">Returns after clearing one error channel to not spend too long in the interrupt. A redundant interrupt will clear any other potential channels.</div></div></div></foreignObject><text x="22" y="304" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px">Returns after clearing one...</text></switch></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>