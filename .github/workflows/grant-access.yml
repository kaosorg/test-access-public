name: Grant Private Repo Access

on:
  issues:
    types: [opened]

jobs:
  grant:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Extract GitHub username
        id: extract
        shell: bash
        run: |
          set +x
          
          BODY=$(jq -r '.issue.body' "$GITHUB_EVENT_PATH")
          
          USERNAME=$(printf "%s\n" "$BODY" \
          | sed -n '
              /^### GitHub Username/{
                :a
                n
                /^[[:space:]]*$/ba
                p
              }' \
          | tr -d '`' \
          | xargs)
          echo "::add-mask::$USERNAME"
          if [ -z "$USERNAME" ]; then
            echo "username=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "username=$USERNAME" >> $GITHUB_OUTPUT


      - name: Validate GitHub user
        env:
          USERNAME: ${{ steps.extract.outputs.username }}
          PAT: ${{ secrets.ACCESS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$USERNAME" ]; then
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/users/$USERNAME)

          if [ "$STATUS" != "200" ]; then
            curl -s -X PATCH \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/kaosorg/test-access-public/issues/$ISSUE_NUMBER \
              -d '{
                "body": "(Username is not a valid GitHub user)",
                "state": "closed",
                "locked": true
              }' \
              > /dev/null
            echo "::error::Username is not a valid GitHub user" && exit 1
          fi
          
      - name: Read issue form data securely
        id: form
        shell: bash
        run: |
          set +x
      
          EVENT="$GITHUB_EVENT_PATH"
      
          # Extract raw body (never printed)
          BODY=$(jq -r '.issue.body' "$EVENT")
      
          # Extract fields by form section
          GH_USER=$(printf "%s\n" "$BODY" | sed -n '
            /^### GitHub Username/{n;/^$/n;p;}
          ' | xargs)
      
          EMAIL=$(printf "%s\n" "$BODY" | sed -n '
            /^### Email Address/{n;/^$/n;p;}
          ' | xargs)
      
          REASON=$(printf "%s\n" "$BODY" | sed -n '
            /^### Why do you want access\?/{n;/^$/n;p;}
          ')
      
          # Pass ONLY what you need, nothing else
          echo "username=$GH_USER" >> "$GITHUB_OUTPUT"

      - name: Build access request payload
        shell: bash
        run: |
          set +x
      
          jq -n \
            --arg issue "${{ github.event.issue.number }}" \
            --arg user "$USERNAME" \
            --arg email "$EMAIL" \
            --arg reason "$REASON" \
            '{
              issue: $issue,
              github_username: $user,
              email: $email,
              reason: $reason,
              submitted_at: now | todate
            }' > payload.json
      
      - name: Store request in private repo
        shell: bash
        env:
          PAT: ${{ secrets.ACCESS_PAT }}
        run: |
          set +x
      
          git clone https://x-access-token:$PAT@github.com/kaosorg/test-access-private.git
          cd access-requests
      
          mkdir -p requests
          mv ../payload.json requests/request-${{ github.event.issue.number }}.json
      
          git config user.name "access-bot"
          git config user.email "access-bot@users.noreply.github.com"
      
          git add requests/
          git commit -m "Access request #${{ github.event.issue.number }}"
          git push
          
      - name: Invite to private repo
        env:
          PAT: ${{ secrets.ACCESS_PAT }}
          USERNAME: ${{ steps.extract.outputs.username }}
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kaosorg/test-access-private/collaborators/$USERNAME \
            -d '{"permission":"pull"}' \
            > /dev/null

      - name: Redact issue
        env:
          PAT: ${{ secrets.ACCESS_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kaosorg/test-access-public/issues/$ISSUE_NUMBER \
            -d '{
              "body": "(redacted — access request processed)",
              "state": "closed",
              "locked": true
            }' \
            > /dev/null
